name: cdc-cache-invalidation

services:
  mysql:
    build: ./mysql
    image: cdc-mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-catalog}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.4-alpine
    command: ["redis-server",
              "--appendonly", "yes",
              "--appendfsync", "everysec",
              "--maxmemory", "256mb",
              "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  writer:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: writer
    image: cdc-writer:dev
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WRITER_PORT: "8080"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-catalog}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-16}
    ports:
      - "${WRITER_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/busybox/wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30

  reader:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: reader
    image: cdc-reader:dev
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      READER_PORT: "8081"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-catalog}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-16}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${READER_HOSPORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "/busybox/wget", "-qO-", "http://localhost:8081/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
  redis-data:
