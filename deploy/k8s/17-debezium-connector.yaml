# Registers the Debezium connector, like `make connector`: create the change topic with
# 6 partitions, then PUT deploy/connect/catalog-items.json to Connect. Both steps are
# safe to repeat. The Job deletes itself 10 minutes after it finishes, so the next
# `kubectl apply -k` creates it again and pushes any change to the JSON.
apiVersion: batch/v1
kind: Job
metadata:
  name: register-connector
  labels:
    app.kubernetes.io/name: register-connector
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: register-connector
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Debezium would create the topic only with the first change, and with its own
        # settings. Creating it first fixes the partition count before anything reads it.
        - name: create-topic
          image: apache/kafka:4.3.2
          command:
            - /opt/kafka/bin/kafka-topics.sh
            - --bootstrap-server=kafka:9092
            - --create
            - --if-not-exists
            - --topic=cdc.catalog.items
            - --partitions=6
            - --replication-factor=1
      containers:
        - name: register
          image: curlimages/curl:8.10.1
          # Connect may still be starting: retry every 3s for up to 3 minutes, on any
          # error, including "no such host" before its pod is Ready.
          args:
            - --fail
            - --silent
            - --show-error
            - --retry
            - "60"
            - --retry-delay
            - "3"
            - --retry-all-errors
            - --request
            - PUT
            - --header
            - "Content-Type: application/json"
            - --data
            - "@/etc/connector/catalog-items.json"
            - http://kafka-connect:8083/connectors/catalog-items/config
          volumeMounts:
            - name: connector
              mountPath: /etc/connector
      volumes:
        - name: connector
          configMap:
            name: debezium-connector
