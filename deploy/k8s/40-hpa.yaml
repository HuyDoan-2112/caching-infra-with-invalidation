# Autoscaling for the writer and the reader. Every 15s the
# HPA reads each pod's CPU from metrics-server and computes
#   desired pods = ceil(current pods x average CPU used / CPU requested / target)
# So the target is a share of the *request* (150m, 200m), not of the 1-CPU limit.
# Needs metrics-server in the cluster (make kind-up installs it).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: writer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: writer
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # Add at most 1 pod every 30s. Remove at most 1 a minute, and only after the load has
  # been low for 5 minutes, so a short dip doesn't remove pods that are needed again.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reader
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reader
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  # Up to 2 pods every 30s; down as for the writer.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
