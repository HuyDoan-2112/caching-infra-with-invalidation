# MySQL credentials for the writer, the reader and the MySQL image's first start.
# Dev-only values, the same as .env.example. A Secret is only base64-encoded, not
# encrypted: anyone who can read Secrets in this namespace can read these.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "root"
  MYSQL_USER: "app"
  MYSQL_PASSWORD: "app"
